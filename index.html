<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png+jpg" href="images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eComProtect</title>
    <!--
      App Bridge v4 bootstrap. Unlike v3 (a createApp()/<Provider> pattern
      driven from React), v4 self-initializes from this meta tag + CDN
      script, exposing a global `window.shopify` object — see
      appbridge.config.ts. %VITE_SHOPIFY_API_KEY% is replaced by Vite at
      build time (client ID, public/safe to expose — same value as the
      backend's SHOPIFY_API_KEY).
    -->
    <meta name="shopify-api-key" content="%VITE_SHOPIFY_API_KEY%" />
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
